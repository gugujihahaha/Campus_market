{% extends 'base.html' %}

{% block content %}

<!-- 页面标题区 -->
<div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-900 tracking-tight">商品列表</h2>
    <p class="mt-1 text-sm text-gray-500">发现校园里的好物</p>
</div>

<!-- 瀑布流卡片网格 -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    {% for item in goods %}
        <a href="/goods/detail/{{ item.id }}/"
           class="group block bg-white rounded-2xl shadow-sm hover:-translate-y-1 hover:shadow-xl transition-all duration-300 overflow-hidden">

            <!-- 图片区 -->
            <div class="aspect-[4/3] overflow-hidden bg-gray-100">
                {% if item.image %}
                    <img src="{{ item.image.url }}"
                         alt="{{ item.title }}"
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                {% else %}
                    <div class="w-full h-full flex items-center justify-center text-gray-300">
                        <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                {% endif %}
            </div>

            <!-- 信息区 -->
            <div class="p-4 sm:p-5">
                <!-- 标题 -->
                <h3 class="text-base font-semibold text-gray-900 line-clamp-2 leading-snug mb-2">
                    {{ item.title }}
                </h3>

                <!-- 价格 -->
                <p class="text-lg font-bold text-rose-700">
                    ￥{{ item.price }}
                </p>

                <!-- 底部标签行（预留） -->
                <div class="mt-3 flex items-center justify-between">
                    <span class="text-xs text-gray-400">查看详情</span>
                    <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-gray-50 text-gray-400 group-hover:bg-gray-900 group-hover:text-white transition-colors duration-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </span>
                </div>
            </div>

        </a>
    {% empty %}
        <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
            <svg class="w-20 h-20 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
            </svg>
            <p class="text-lg">暂无商品</p>
            <p class="text-sm mt-1">快去看看有什么好物上架吧</p>
        </div>
    {% endfor %}
</div>

{% endblock %}
