{% extends 'base.html' %}

{% block title %}登录 - 校园二手{% endblock %}

{% block content %}

<!-- ==================== 全屏渐变背景 + 装饰几何图形 ==================== -->
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center px-4 relative overflow-hidden bg-gradient-to-br from-indigo-50 via-white to-purple-50">

    <!-- 左上角装饰圆 -->
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-gradient-to-br from-indigo-400/20 to-purple-400/10 blur-3xl"></div>
    <!-- 右上角装饰圆 -->
    <div class="absolute -top-20 -right-20 w-80 h-80 rounded-full bg-gradient-to-bl from-indigo-300/15 to-blue-400/10 blur-3xl"></div>
    <!-- 右下角装饰圆 -->
    <div class="absolute -bottom-32 -right-32 w-[30rem] h-[30rem] rounded-full bg-gradient-to-tl from-indigo-400/15 to-purple-500/10 blur-3xl"></div>
    <!-- 左下角几何方块 -->
    <div class="absolute bottom-16 left-10 w-24 h-24 rounded-3xl bg-gradient-to-tr from-indigo-400/10 to-indigo-500/5 rotate-12 blur-sm"></div>
    <div class="absolute top-1/3 right-16 w-16 h-16 rounded-2xl bg-gradient-to-bl from-purple-400/8 to-indigo-400/10 -rotate-12 blur-sm"></div>

    <div class="w-full max-w-md relative z-10">

        <!-- ===== 卡片头部 ===== -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-600 to-indigo-800 shadow-xl shadow-indigo-500/25 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-900">欢迎回来</h1>
            <p class="mt-1 text-sm text-gray-500">登录你的校园二手账号</p>
        </div>

        <!-- ===== 毛玻璃主卡片 ===== -->
        <div class="bg-white/75 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-indigo-900/10 ring-1 ring-white/60 p-8">

            <!-- 错误提示 -->
            {% if error %}
                <div class="flex items-start gap-3 p-4 mb-6 rounded-2xl bg-red-50 border border-red-100 shadow-sm">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-red-100 flex items-center justify-center">
                        <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-red-800">登录失败</p>
                        <p class="text-sm text-red-600 mt-0.5">{{ error }}</p>
                    </div>
                </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <!-- 用户名 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">用户名</label>
                    <div class="relative">
                        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-indigo-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </span>
                        <input type="text"
                               name="username"
                               placeholder="你的用户名"
                               required
                               class="w-full pl-11 pr-4 py-3 text-sm text-gray-900 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white transition-all duration-200 placeholder:text-gray-300">
                    </div>
                </div>

                <!-- 密码 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">密码</label>
                    <div class="relative">
                        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-indigo-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </span>
                        <input type="password"
                               name="password"
                               placeholder="••••••••"
                               required
                               class="w-full pl-11 pr-4 py-3 text-sm text-gray-900 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent focus:bg-white transition-all duration-200 placeholder:text-gray-300">
                    </div>
                </div>

                <!-- 登录按钮 -->
                <button type="submit"
                        class="w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-indigo-700 rounded-2xl hover:from-indigo-700 hover:to-indigo-800 hover:shadow-xl hover:shadow-indigo-500/25 transition-all duration-300 shadow-lg shadow-indigo-500/20 active:scale-[0.98]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    登录
                </button>
            </form>
        </div>

        <!-- 底部跳转 -->
        <p class="mt-6 text-center text-sm text-gray-500">
            还没有账号？
            <a href="/goods/register/" class="font-semibold text-indigo-600 hover:text-indigo-700 hover:underline transition-all">
                立即注册 →
            </a>
        </p>
    </div>
</div>

{% endblock %}
