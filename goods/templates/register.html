{% extends 'base.html' %}

{% block title %}注册 - 校园二手{% endblock %}

{% block content %}

<!-- ==================== 全屏渐变背景 + 装饰几何图形 ==================== -->
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center px-4 relative overflow-hidden bg-gradient-to-br from-emerald-50 via-white to-teal-50">

    <!-- 左上角装饰圆 -->
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-gradient-to-br from-emerald-400/20 to-teal-400/10 blur-3xl"></div>
    <!-- 右上角装饰圆 -->
    <div class="absolute -top-20 -right-20 w-80 h-80 rounded-full bg-gradient-to-bl from-emerald-300/15 to-green-400/10 blur-3xl"></div>
    <!-- 右下角装饰圆 -->
    <div class="absolute -bottom-32 -right-32 w-[30rem] h-[30rem] rounded-full bg-gradient-to-tl from-emerald-400/15 to-teal-500/10 blur-3xl"></div>
    <!-- 左下角几何方块 -->
    <div class="absolute bottom-16 left-10 w-24 h-24 rounded-3xl bg-gradient-to-tr from-emerald-400/10 to-teal-500/5 rotate-12 blur-sm"></div>
    <div class="absolute top-1/3 right-16 w-16 h-16 rounded-2xl bg-gradient-to-bl from-teal-400/8 to-emerald-400/10 -rotate-12 blur-sm"></div>

    <div class="w-full max-w-md relative z-10">

        <!-- ===== 卡片头部 ===== -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 shadow-xl shadow-emerald-500/25 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-900">创建账号</h1>
            <p class="mt-1 text-sm text-gray-500">加入校园二手，发现身边好物 ✨</p>
        </div>

        <!-- ===== 毛玻璃主卡片 ===== -->
        <div class="bg-white/75 backdrop-blur-2xl rounded-3xl shadow-2xl shadow-emerald-900/10 ring-1 ring-white/60 p-8">

            <!-- 错误提示 -->
            {% if error %}
                <div class="flex items-start gap-3 p-4 mb-6 rounded-2xl bg-red-50 border border-red-100 shadow-sm">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-red-100 flex items-center justify-center">
                        <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-red-800">注册失败</p>
                        <p class="text-sm text-red-600 mt-0.5">{{ error }}</p>
                    </div>
                </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <!-- 用户名 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">用户名</label>
                    <div class="relative">
                        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </span>
                        <input type="text"
                               name="username"
                               placeholder="输入你的用户名（唯一、不可更改）"
                               required
                               class="w-full pl-11 pr-4 py-3 text-sm text-gray-900 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent focus:bg-white transition-all duration-200 placeholder:text-gray-300">
                    </div>
                </div>

                <!-- 密码 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">密码</label>
                    <div class="relative">
                        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-emerald-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </span>
                        <input type="password"
                               name="password"
                               placeholder="至少 6 位字符"
                               required
                               class="w-full pl-11 pr-4 py-3 text-sm text-gray-900 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent focus:bg-white transition-all duration-200 placeholder:text-gray-300">
                    </div>
                    <p class="mt-1.5 text-xs text-gray-400">密码长度至少 6 位，建议包含字母和数字</p>
                </div>

                <!-- 注册按钮 -->
                <button type="submit"
                        class="w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 text-sm font-semibold text-white bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl hover:from-emerald-600 hover:to-teal-700 hover:shadow-xl hover:shadow-emerald-500/25 transition-all duration-300 shadow-lg shadow-emerald-500/20 active:scale-[0.98]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                    创建账号
                </button>
            </form>
        </div>

        <!-- 底部跳转 -->
        <p class="mt-6 text-center text-sm text-gray-500">
            已有账号？
            <a href="/goods/login/" class="font-semibold text-emerald-600 hover:text-emerald-700 hover:underline transition-all">
                去登录 →
            </a>
        </p>
    </div>
</div>

{% endblock %}
