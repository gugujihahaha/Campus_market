{% extends 'base.html' %}

{% block title %}重置链接已发送 - 校园二手{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-12 sm:mt-20">
    <div class="bg-white rounded-3xl shadow-sm ring-1 ring-gray-100 p-8 sm:p-10 text-center">

        <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
        </div>

        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">重置链接已生成</h1>
        <p class="text-sm text-gray-500 mb-6">
            用户 <strong>{{ username }}</strong>，请使用以下链接重置密码（开发模式直接显示）：
        </p>

        <div class="bg-gray-50 rounded-xl p-4 mb-6 text-left">
            <p class="text-xs text-gray-400 mb-1">重置链接（24小时内有效）：</p>
            <a href="{{ reset_link }}" class="text-sm text-emerald-600 break-all hover:text-emerald-700">
                {{ reset_link }}
            </a>
        </div>

        <p class="text-xs text-gray-400">
            在实际生产环境中，此链接将发送到你的注册邮箱。
        </p>

        <div class="mt-6">
            <a href="/goods/login/" class="text-sm text-emerald-600 hover:text-emerald-700 transition-colors">
                ← 返回登录
            </a>
        </div>
    </div>
</div>

{% endblock %}
